# Private API for Second Look. It has no public IP: only the web app reaches it, over Fly's
# private network (secondlook-api.flycast). Deploy with:
#   fly deploy --no-public-ips
app = "secondlook-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  LLM_PROVIDER = "ollama"
  OLLAMA_MODEL = "qwen3.5:35b"
  OLLAMA_THINK = "false"
  # One scan at a time on the home computer; text scans wait up to 20 s, then skip the AI.
  OLLAMA_MAX_CONCURRENT = "1"
  OLLAMA_QUEUE_SECONDS = "20"
  OLLAMA_CONNECT_TIMEOUT_SECONDS = "5"
  DATABASE_URL = "sqlite:////data/secondlook.db"
  # Set by Fly's edge on every visitor request, and passed through by the web app.
  CLIENT_IP_HEADER = "fly-client-ip"
  CORS_ORIGINS = "https://secondlook-web.fly.dev"
  PORT = "8000"
  # Secrets, set with `fly secrets set`: TS_AUTHKEY (Tailscale) and OLLAMA_BASE_URL (http://<your computer's Tailscale IP>:11434)

[[mounts]]
  source = "secondlook_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
