[project]
name = "secondlook-backend"
version = "0.1.0"
description = "Second Look: AI scam checker API"
authors = [{ name = "Hoang (Chris) Pham" }]
license = "MIT"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "defusedxml>=0.7.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.4",
    "sqlalchemy>=2.1.6",
    "tldextract>=5.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Prompt text and user-facing advice are prose; wrapping them hurts readability.
"app/llm.py" = ["E501"]
"app/pipeline.py" = ["E501"]
"tests/*" = ["E501"]
"evals/*" = ["E501"]
